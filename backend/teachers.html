<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartEdu Teachers</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }

  #auth-screen { min-height: 100vh; background: linear-gradient(135deg, #1a6b3c, #2ecc71); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .auth-logo { text-align: center; font-size: 60px; margin-bottom: 10px; }
  .auth-title { text-align: center; font-size: 24px; font-weight: 700; color: #1a6b3c; margin-bottom: 6px; }
  .auth-subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 14px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
  .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 15px; background: #f9f9f9; outline: none; }
  .form-group input:focus { border-color: #1a6b3c; background: #fff; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn-green { background: #1a6b3c; color: #fff; }
  .btn-telegram { background: #0088cc; color: #fff; }
  .btn-back { background: none; border: none; color: #1a6b3c; font-size: 14px; cursor: pointer; margin-top: 12px; }
  .version-text { text-align: center; color: #aaa; font-size: 12px; margin-top: 20px; }

  #app-screen { display: none; flex-direction: column; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1a6b3c, #2ecc71); color: #fff; padding: 20px; display: flex; align-items: center; justify-content: space-between; }
  .header-info h2 { font-size: 22px; font-weight: 700; }
  .header-info p { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .logout-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; }

  .bottom-nav { background: #fff; border-top: 1px solid #e0e0e0; display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; }
  .nav-tab { flex: 1; padding: 12px 4px 8px; text-align: center; cursor: pointer; border: none; background: none; color: #aaa; font-size: 11px; }
  .nav-tab .tab-icon { font-size: 22px; display: block; margin-bottom: 3px; }
  .nav-tab.active { color: #1a6b3c; font-weight: 600; }

  .content { flex: 1; padding: 20px; padding-bottom: 80px; overflow-y: auto; }
  .page { display: none; }
  .page.active { display: block; }
  .page-title { font-size: 20px; font-weight: 700; color: #222; margin-bottom: 20px; }

  /* Stats */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .stat-card { background: linear-gradient(135deg, #1a6b3c, #2ecc71); border-radius: 14px; padding: 18px; color: #fff; text-align: center; }
  .stat-value { font-size: 28px; font-weight: 700; }
  .stat-label { font-size: 12px; opacity: 0.85; margin-top: 4px; }

  /* Group cards */
  .section-title { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 12px; }
  .group-card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 12px; cursor: pointer; transition: transform .1s; }
  .group-card:active { transform: scale(0.98); }
  .group-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .group-name { font-size: 16px; font-weight: 700; color: #222; }
  .group-detail { font-size: 13px; color: #666; margin-top: 4px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-blue { background: #dbeafe; color: #1d4ed8; }

  /* Students list */
  .back-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; color: #1a6b3c; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 16px; padding: 8px 0; }
  .student-card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 12px; }
  .student-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .student-name { font-size: 15px; font-weight: 600; color: #222; }
  .student-coins { font-size: 14px; color: #888; }
  .student-phone { font-size: 13px; color: #888; margin-bottom: 10px; }
  .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .act-btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-present { background: #dcfce7; color: #166534; }
  .btn-absent { background: #fee2e2; color: #991b1b; }
  .btn-coin { background: #fef9c3; color: #854d0e; }

  /* Coin modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 20px; padding: 28px; width: 100%; max-width: 360px; }
  .modal-title { font-size: 18px; font-weight: 700; color: #222; margin-bottom: 16px; }
  .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
  .modal-footer .btn { flex: 1; }
  .btn-outline { background: #fff; border: 1.5px solid #ddd; color: #555; }

  .loading-text { text-align: center; color: #888; padding: 40px; font-size: 16px; }
  .empty-state { text-align: center; color: #aaa; padding: 40px 20px; }
  .toast { position: fixed; bottom: 90px; right: 20px; padding: 12px 20px; border-radius: 10px; color: #fff; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity .3s; }
  .toast.show { opacity: 1; }
  .toast-success { background: #27ae60; }
  .toast-error { background: #e74c3c; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">👨‍🏫</div>
    <h1 class="auth-title">SmartEdu Teachers</h1>
    <p class="auth-subtitle">Ustozlar uchun panel</p>

    <div id="step-login">
      <div class="form-group">
        <label>📱 Telefon raqam</label>
        <input type="tel" id="login-phone" placeholder="+998 xx xxx xx xx">
      </div>
      <div class="form-group">
        <label>🔐 Parol (agar bor bo'lsa)</label>
        <input type="password" id="login-password" placeholder="Parolingizni kiriting">
      </div>
      <button class="btn btn-green" onclick="handleLogin()">🚀 Kirish / Kod yuborish</button>
    </div>

    <div id="step-verify" style="display:none">
      <p style="text-align:center;color:#555;margin-bottom:16px;font-size:14px">Telegram botdan kod oling</p>
      <a href="https://t.me/SmartEduVerificationBot" target="_blank">
        <button class="btn btn-telegram" style="margin-bottom:12px">🤖 SmartEduVerificationBot</button>
      </a>
      <div class="form-group">
        <label>6 raqamli kod</label>
        <input type="number" id="verify-code" maxlength="6" placeholder="Kodni kiriting">
      </div>
      <button class="btn btn-green" onclick="handleVerify()">Tasdiqlash</button>
      <div style="text-align:center"><button class="btn-back" onclick="goBack()">← Orqaga</button></div>
    </div>

    <div id="step-password" style="display:none">
      <div class="form-group">
        <label>Yangi parol</label>
        <input type="password" id="new-password" placeholder="Kamida 4 belgi">
      </div>
      <button class="btn btn-green" onclick="handleSetPassword()">Saqlash va Kirish</button>
    </div>

    <p class="version-text">SmartEdu v1.0 • Teachers</p>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="header">
    <div class="header-info">
      <h2>👨‍🏫 <span id="teacher-name-display">Ustoz</span></h2>
      <p>Ustoz Paneli</p>
    </div>
    <button class="logout-btn" onclick="handleLogout()">🚪</button>
  </div>

  <div class="content">
    <!-- Dashboard -->
    <div id="page-dashboard" class="page active">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-value" id="stat-groups">0</div>
          <div class="stat-label">Jami guruhlar</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-today">0</div>
          <div class="stat-label">Bugungi darslar</div>
        </div>
      </div>
      <div class="section-title">📅 Bugungi Darslar</div>
      <div id="today-groups"></div>
      <div class="section-title" style="margin-top:20px">📚 Barcha Guruhlar</div>
      <div id="all-groups"></div>
    </div>

    <!-- Group detail -->
    <div id="page-group" class="page">
      <button class="back-btn" onclick="switchTab('dashboard')">← Orqaga</button>
      <h2 class="page-title" id="group-page-title">👥 Guruh</h2>
      <div id="group-students"><div class="loading-text">Yuklanmoqda...</div></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-tab active" onclick="switchTabBtn('dashboard', this)">
      <span class="tab-icon">🏠</span>Bosh
    </button>
    <button class="nav-tab" onclick="switchTabBtn('group', this)">
      <span class="tab-icon">👥</span>Guruh
    </button>
  </div>
</div>

<!-- Coin Modal -->
<div id="coin-modal" class="modal-overlay">
  <div class="modal">
    <h3 class="modal-title">🪙 Coin Berish</h3>
    <p id="coin-student-name" style="color:#555;margin-bottom:14px"></p>
    <div class="form-group">
      <label>Coin miqdori</label>
      <input type="number" id="coin-amount" placeholder="Masalan: 5" value="5">
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('coin-modal')">Bekor</button>
      <button class="btn btn-green" onclick="awardCoin()">Berish</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_URL = window.location.origin;
let teacherId = localStorage.getItem('teacherId');
let userId = '';
let currentGroupId = '';
let currentCoinStudentId = '';

window.onload = () => {
  if (teacherId && localStorage.getItem('userRole') === 'teacher') showApp();
};

async function handleLogin() {
  const phone = document.getElementById('login-phone').value.trim();
  const password = document.getElementById('login-password').value.trim();
  if (!phone) { showToast('Telefon raqamni kiriting', 'error'); return; }
  try {
    if (password) {
      try {
        const res = await fetch(`${API_URL}/api/teacher/login`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('userRole','teacher');
          localStorage.setItem('teacherId', data.teacher_id);
          localStorage.setItem('teacherName', data.name);
          teacherId = data.teacher_id;
          showApp(); return;
        }
      } catch(e) {}
    }
    await fetch(`${API_URL}/api/teacher/request-code`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ phone })
    });
    document.getElementById('step-login').style.display = 'none';
    document.getElementById('step-verify').style.display = 'block';
  } catch(e) { showToast('Xatolik yuz berdi', 'error'); }
}

async function handleVerify() {
  const phone = document.getElementById('login-phone').value.trim();
  const code = document.getElementById('verify-code').value.trim();
  try {
    const res = await fetch(`${API_URL}/api/teacher/verify-code`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ phone, code })
    });
    const data = await res.json();
    userId = data.teacher_id;
    if (data.has_password) { showToast('Parolingiz bilan kiring', 'success'); goBack(); }
    else { document.getElementById('step-verify').style.display = 'none'; document.getElementById('step-password').style.display = 'block'; }
  } catch(e) { showToast('Kod noto\'g\'ri', 'error'); }
}

async function handleSetPassword() {
  const phone = document.getElementById('login-phone').value.trim();
  const password = document.getElementById('new-password').value.trim();
  if (!password || password.length < 4) { showToast('Parol kamida 4 belgi', 'error'); return; }
  try {
    await fetch(`${API_URL}/api/teacher/set-password`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ teacher_id: userId, password })
    });
    const res = await fetch(`${API_URL}/api/teacher/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ phone, password })
    });
    const data = await res.json();
    localStorage.setItem('userRole','teacher');
    localStorage.setItem('teacherId', data.teacher_id);
    localStorage.setItem('teacherName', data.name);
    teacherId = data.teacher_id;
    showApp();
  } catch(e) { showToast('Xatolik yuz berdi', 'error'); }
}

function goBack() {
  document.getElementById('step-verify').style.display = 'none';
  document.getElementById('step-password').style.display = 'none';
  document.getElementById('step-login').style.display = 'block';
}

function handleLogout() {
  localStorage.clear(); teacherId = null;
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
}

function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'flex';
  document.getElementById('teacher-name-display').textContent = localStorage.getItem('teacherName') || 'Ustoz';
  loadDashboard();
}

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
}

function switchTabBtn(tab, btn) {
  switchTab(tab);
  document.querySelectorAll('.nav-tab').forEach(n => n.classList.remove('active'));
  btn.classList.add('active');
  if (tab === 'dashboard') loadDashboard();
}

const dayNames = {1:'Du',2:'Se',3:'Ch',4:'Pa',5:'Ju',6:'Sh'};

async function loadDashboard() {
  try {
    const [dashRes, grpRes] = await Promise.all([
      fetch(`${API_URL}/api/teacher/dashboard/${teacherId}`),
      fetch(`${API_URL}/api/teacher/groups/${teacherId}`)
    ]);
    const dash = await dashRes.json();
    const allGroups = await grpRes.json();
    document.getElementById('stat-groups').textContent = dash.total_groups || 0;
    document.getElementById('stat-today').textContent = dash.today_classes || 0;

    const todayGroups = document.getElementById('today-groups');
    const todayList = (dash.groups || []);
    if (!todayList.length) todayGroups.innerHTML = '<div style="color:#aaa;font-size:14px;padding:10px 0">Bugun dars yo\'q</div>';
    else todayGroups.innerHTML = todayList.map(g => `
      <div class="group-card" onclick="openGroup('${g.id}','${g.name}')">
        <div class="group-header">
          <span class="group-name">👥 ${g.name}</span>
          <span class="badge badge-green">Bugun</span>
        </div>
        <div class="group-detail">📚 ${g.subject||'—'} &nbsp; 🕐 ${g.time_start||'—'}–${g.time_end||'—'}</div>
      </div>`).join('');

    const allEl = document.getElementById('all-groups');
    if (!allGroups.length) allEl.innerHTML = '<div style="color:#aaa;font-size:14px;padding:10px 0">Guruhlar yo\'q</div>';
    else allEl.innerHTML = allGroups.map(g => `
      <div class="group-card" onclick="openGroup('${g.id}','${g.name}')">
        <div class="group-header">
          <span class="group-name">👥 ${g.name}</span>
          <span class="badge badge-blue">${(g.schedule_days||[]).map(d=>dayNames[d]||d).join(', ')}</span>
        </div>
        <div class="group-detail">📚 ${g.subject||'—'} &nbsp; 🕐 ${g.time_start||'—'}–${g.time_end||'—'}</div>
      </div>`).join('');
  } catch(e) { console.error(e); }
}

async function openGroup(groupId, groupName) {
  currentGroupId = groupId;
  document.getElementById('group-page-title').textContent = '👥 ' + groupName;
  switchTab('group');
  document.querySelectorAll('.nav-tab').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.nav-tab')[1].classList.add('active');
  loadGroupStudents(groupId);
}

async function loadGroupStudents(groupId) {
  const el = document.getElementById('group-students');
  el.innerHTML = '<div class="loading-text">Yuklanmoqda...</div>';
  try {
    const res = await fetch(`${API_URL}/api/teacher/group/${groupId}/students`);
    const students = await res.json();
    if (!students.length) { el.innerHTML = '<div class="empty-state">O\'quvchilar yo\'q</div>'; return; }
    el.innerHTML = students.map(s => `
      <div class="student-card">
        <div class="student-header">
          <span class="student-name">${s.name}</span>
          <span class="student-coins">🪙 ${s.coins||0}</span>
        </div>
        <div class="student-phone">📞 ${s.phone}</div>
        <div class="action-btns">
          <button class="act-btn btn-present" onclick="markAttendance('${s.id}','${s.name}',1)">✅ Keldi</button>
          <button class="act-btn btn-absent" onclick="markAttendance('${s.id}','${s.name}',0)">❌ Kelmadi</button>
          <button class="act-btn btn-coin" onclick="openCoinModal('${s.id}','${s.name}')">🪙 Coin</button>
        </div>
      </div>`).join('');
  } catch(e) { el.innerHTML = '<div class="loading-text">Xatolik yuz berdi</div>'; }
}

async function markAttendance(studentId, studentName, status) {
  const today = new Date().toISOString().split('T')[0];
  try {
    await fetch(`${API_URL}/api/teacher/attendance`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ group_id: currentGroupId, student_id: studentId, status, date: today })
    });
    showToast(status === 1 ? `${studentName} darsda ✅` : `${studentName} darsda yo'q ❌`, 'success');
  } catch(e) { showToast('Xatolik yuz berdi', 'error'); }
}

function openCoinModal(studentId, studentName) {
  currentCoinStudentId = studentId;
  document.getElementById('coin-student-name').textContent = '👤 ' + studentName;
  document.getElementById('coin-amount').value = '5';
  document.getElementById('coin-modal').classList.add('open');
}

async function awardCoin() {
  const coins = parseInt(document.getElementById('coin-amount').value);
  if (!coins || coins <= 0) { showToast('Coin miqdorini kiriting', 'error'); return; }
  try {
    await fetch(`${API_URL}/api/teacher/award-coin`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ student_id: currentCoinStudentId, coins })
    });
    closeModal('coin-modal');
    showToast(`${coins} coin berildi 🪙`, 'success');
    loadGroupStudents(currentGroupId);
  } catch(e) { showToast('Xatolik yuz berdi', 'error'); }
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast toast-${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
});
</script>
</body>
</html>
